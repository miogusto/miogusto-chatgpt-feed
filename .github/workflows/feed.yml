name: ChatGPT urun akisi

on:
  schedule:
    - cron: "17 * * * *"   # her saat basi 17. dakikada (UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: XML'i CSV.GZ'ye cevir
        env:
          XML_URL: ${{ secrets.XML_URL }}
        run: python convert.py public/urunler.csv.gz
      - name: Basit bilgi sayfasi
        run: |
          echo "<!doctype html><meta charset=utf-8><title>Mio Gusto urun akisi</title><p>Son guncelleme: $(date -u +'%Y-%m-%d %H:%M UTC')</p><p><a href=urunler.csv.gz>urunler.csv.gz</a></p>" > public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
