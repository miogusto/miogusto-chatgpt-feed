name: Zamanlanmis isi canli tut

# Herkese acik depolarda 60 gun hareketsizlikten sonra zamanlanmis isler durur.
# Ayda bir bos commit atarak saatlik akisin durmasini engeller.
on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
